name: Smartway Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client & Run SQLite Migrations
        run: |
          cd backend
          npx prisma generate
          npx prisma db push
          npm run prisma:seed

      - name: Execute Backend Integration Test Suite
        run: |
          cd backend
          npm test

      - name: Build Backend Distribution
        run: |
          cd backend
          npm run build

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.smartway-edtech.com/api/v1

